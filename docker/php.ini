; WordPress image defaults are too small for this theme's ACF Flexible Content
; field. When PHP truncates $_POST, ACF's nonce never arrives and wp-admin
; shows: "Validation failed. ACF was unable to perform validation because no
; nonce was received by the server."
; https://www.advancedcustomfields.com/resources/validation-nonce-errors/
max_input_vars = 10000
post_max_size = 64M
upload_max_filesize = 64M
memory_limit = 256M
